name: Community-Decks aktualisieren

# Wertet die beliebtesten öffentlichen Decks je Legende auf Piltover Archive
# aus (scripts/fetch-community.mjs) und schreibt data/community.json.
on:
  schedule:
    - cron: '41 5 * * 1'      # montags 05:41 UTC, vor dem Meta-Update
  workflow_dispatch:
  push:
    branches: ['claude/**']   # zum Testen auf Arbeitsbranches
    paths: ['scripts/fetch-community.mjs', '.github/workflows/update-community.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Piltover Archive auswerten
        run: |
          node scripts/fetch-community.mjs | tee community.log
          # Zusammenfassung als Hinweise im Lauf sichtbar machen
          while IFS= read -r line; do echo "::notice::$line"; done < community.log

      - name: Aenderungen committen
        run: |
          if git diff --quiet -- data/community.json 2>/dev/null && ! git ls-files --others --exclude-standard | grep -q community.json; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community.json
          git commit -m "Community-Decks aktualisiert (Piltover Archive)"
          git push origin HEAD:${GITHUB_REF_NAME}
