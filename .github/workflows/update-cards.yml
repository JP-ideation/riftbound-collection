name: Kartendaten aktualisieren

on:
  schedule:
    - cron: '17 4 * * *'      # taeglich 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Offizielle Kartendatenbank holen
        run: node scripts/fetch-cards.mjs

      - name: Aenderungen committen
        run: |
          if git diff --quiet -- data/cards.json; then
            echo "Keine Aenderungen an den Kartendaten."
            exit 0
          fi
          COUNT=$(node -e "console.log(require('./data/cards.json').count)")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          git commit -m "Kartendaten aktualisiert (${COUNT} Karten)"
          git push
