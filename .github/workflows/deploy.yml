name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  # Pushes des Datenworkflows laufen unter GITHUB_TOKEN und loesen per
  # GitHub-Design KEINEN push-Event aus. Ohne diesen Trigger landen neue
  # Kartensets zwar im Repo, aber nie auf der Live-Seite.
  workflow_run:
    workflows: ["Kartendaten aktualisieren"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Nach einem Datenlauf nur deployen, wenn dieser erfolgreich war.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
